<div class="col">
    <div class="card border-0 shadow-sm h-100 metric-card">
        <div class="card-body">
            <div class="text-secondary small text-uppercase mb-2">{{ label }}</div>
            <div class="d-flex justify-content-between align-items-center">
                <div class="display-6 fw-semibold mb-0">{{ value }}</div>
                <i class="bi {{ icon }} metric-icon"></i>
            </div>
        </div>
    </div>
</div>
