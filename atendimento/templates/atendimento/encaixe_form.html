{% extends 'base.html' %}
{% block title %}Novo encaixe | AgendM{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-xl-7"><div class="card border-0 shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-4">Registrar encaixe</h1>
    <form method="post" class="row g-3">{% csrf_token %}
        {% for field in form %}<div class="col-12"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}
        <div class="col-12 d-flex justify-content-end gap-2"><a href="{% url 'dashboard:home' %}" class="btn btn-outline-secondary">Cancelar</a><button class="btn btn-success"><i class="bi bi-check2"></i> Salvar</button></div>
    </form>
</div></div></div></div>
{% endblock %}
